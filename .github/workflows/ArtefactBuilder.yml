name: Artefact Builder

on:
  workflow_dispatch:

jobs:
  Artefact-Producer:
    runs-on: ubuntu-latest
    steps:
      - name: Create Arftefact
        run: |
          echo "This Artefact Is Generated" > Artifact.txt
          echo "Generated by artifact-producer job on $(date)" >> Artifact.txt

      - name: Upload Arftifact
        uses: actions/upload-artifact@v4
        with: 
          name: example-artifact
          path: Artifact.txt

  Artefact-Consumer:
    runs-on: ubuntu-latest
    needs: Artefact-Producer
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: example-artifact

      - name: Open Artifact.txt
        run: cat Artifact.txt
