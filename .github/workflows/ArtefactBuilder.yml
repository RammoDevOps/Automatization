name: Build-Test-Deploy Artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-sha: ${{ steps.get-sha.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-nginx:latest .

      - name: Get image SHA
        id: get-sha
        run: |
          SHA=$(docker images --no-trunc -q my-nginx:latest)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Save Docker image as artifact
        run: docker save my-nginx:latest -o my-nginx-${{ github.sha }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: my-nginx-${{ github.sha }}.tar

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: docker load -i my-nginx-${{ github.sha }}.tar

      - name: Run tests
        run: |
          docker run -d -p 8080:80 --name test-nginx my-nginx:latest
          curl -f http://localhost:8080
          docker rm -f test-nginx

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: docker load -i my-nginx-${{ github.sha }}.tar

      - name: Deploy container pinned by SHA
        run: |
          IMAGE_SHA=${{ needs.build.outputs.image-sha }}
          docker stop nginx-prod || true
          docker rm nginx-prod || true
          docker tag my-nginx:latest my-nginx:$IMAGE_SHA
          docker run -d -p 80:80 --name nginx-prod my-nginx:$IMAGE_SHA
