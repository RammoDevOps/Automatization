name: Avtamataa

on: 
  workflow_dispatch:

jobs:
  Hello:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hello World
        run: echo "Hello Gays"

  Run-Test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOs-latest ]
        python-version: ["3.12"]
    timeout-minutes: 3
    needs: [Hello]
    steps:
      - name: Repo Cloning
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Script
        run: python MyNumbers.py

  Bye:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [ Hello, Run-Test ]
    steps:
      - name: Bye Bye
        run: echo "Bye Bye Beber"
