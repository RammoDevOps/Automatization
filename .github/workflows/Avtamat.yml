name: Avtamat

on:
  push: 
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello 
        run: echo "Hello Negro"

  Run-Script:
    runs-on: ubuntu-latest
    needs: [Hello]
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actons/python-setup@v4
        with:
          python-version: "3.14" 

      - name: Run Script
        run: python3 MyNumbers.py
