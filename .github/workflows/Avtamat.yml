name: Avtamat

env:
  APP_NAME: "My Aplication"
  APP_PACKAGE: "my_app_${{ github.sha }}"

on:
  push: 
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello 
        run: echo "Hello Negro"

  Run-Script:
    runs-on: ubuntu-latest
    needs: [Hello]
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Pipeline Example
        run: |
          echo "App Name: ${{ env.APP_NAME }}"
          echo "App Package: ${{ env.APP_PACKAGE }}"

      - name: Python Setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.14" 

      - name: Run Script
        run: python MyNumbers.py
