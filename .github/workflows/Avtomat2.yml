name: Avtomat2

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello Broski
        run: echo "Hello Broski"
        
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: List Directories
        run: ls -la

  How:
    runs-on: ubuntu-latest
    needs: [ Hello ]
    steps:
      - name: How Are You Broski
        run: echo "How Are You Broski"

  Bye:
    runs-on: ubuntu-latest
    needs: [ Hello, How ]
    steps:
      - name: Bye Bye Broski
        run: echo "Bye Bye Broski"
